apiVersion: apps/v1
kind: Deployment
metadata:
  name: computation-deployment
  labels:
    app: computation
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 25%
      maxSurge: 0
  selector:
    matchLabels:
      app: computation
  template:
    metadata:
      labels:
        app: computation
        label: label
    spec:
      containers:
        - name: computation
          image: ahmodiyy/computation:caching
          ports:
            - containerPort: 8081
---
apiVersion: v1
kind: Service
metadata:
  name: computation-service
spec:
  type: NodePort
  selector:
    app: computation
  ports:
    - port: 8081


